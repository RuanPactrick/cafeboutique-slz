<!-- @dsCard group="Conteúdo" height=290 -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Antic+Didone&family=Lustria&display=swap">
<style>
  .wrap { padding: 20px; background: var(--paper, #fbf7ee); font-family: var(--font-body, "Lustria", Georgia, serif); color: var(--ink, #321f17); }
  .menu-category__heading { display: grid; min-height: 84px; grid-template-columns: 1fr auto auto; align-items: center; gap: 1rem; padding: 1rem 1.2rem; border-top: 1px solid var(--rule, #d9cdbb); border-bottom: 1px solid var(--rule, #d9cdbb); }
  .menu-category__heading h2 { margin: 0; color: var(--coffee, #2b160e); font-family: var(--font-display, "Antic Didone", Georgia, serif); font-weight: 400; line-height: 1.02; font-size: 2rem; }
  .menu-category__count { color: var(--muted, #76685c); font-size: .66rem; }
  .menu-category__chevron { width: .65rem; height: .65rem; border-right: 1px solid; border-bottom: 1px solid; transform: rotate(225deg); }
  .menu-category__body { padding: 1.2rem 1.2rem 0; }
  .menu-group h3 { margin: 0 0 .7rem; color: var(--olive, #8c7d5f); font-family: inherit; font-size: .65rem; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; }
  .menu-list { display: grid; gap: .9rem; margin: 0; padding: 0; list-style: none; }
  .menu-item { display: grid; grid-template-columns: 1fr auto; gap: 1rem; padding-bottom: .8rem; border-bottom: 1px dotted var(--rule, #d9cdbb); }
  .menu-item__copy h4 { margin: 0; font-family: inherit; font-size: .8rem; font-weight: 400; line-height: 1.35; }
  .menu-item__copy p { margin: .2rem 0 0; color: var(--muted, #76685c); font-size: .67rem; }
  .menu-item__pending { color: var(--pending, #8f6335); }
  .menu-item__price { color: var(--coffee, #2b160e); font-size: .78rem; white-space: nowrap; }
</style>

<div class="wrap">
  <div class="menu-category__heading">
    <h2>Capuccinos</h2>
    <span class="menu-category__count">12 itens</span>
    <span class="menu-category__chevron" aria-hidden="true"></span>
  </div>
  <div class="menu-category__body">
    <div class="menu-group">
      <h3>Tradicionais</h3>
      <ul class="menu-list">
        <li class="menu-item">
          <div class="menu-item__copy"><h4>Capuccino Tradicional Pequeno 60ml</h4></div>
          <span class="menu-item__price">R$ 10,00</span>
        </li>
        <li class="menu-item">
          <div class="menu-item__copy"><h4>Capuccino Tradicional 150ml</h4></div>
          <span class="menu-item__price">R$ 20,00</span>
        </li>
        <li class="menu-item">
          <div class="menu-item__copy">
            <h4>Capuccino Tradicional com Chantilly 150l</h4>
            <p class="menu-item__pending">A fonte registra “150l”; confirmar a unidade antes da publicação definitiva.</p>
          </div>
          <span class="menu-item__price">R$ 25,00</span>
        </li>
      </ul>
    </div>
  </div>
</div>
