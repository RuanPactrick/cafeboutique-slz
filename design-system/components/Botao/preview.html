  .f + .f { background: var(--coffee, #2b160e); }
  .button { display: inline-flex; min-height: 48px; align-items: center; justify-content: center; gap: 6px; padding: .7rem 1.5rem; border: 1px solid var(--coffee, #2b160e); border-radius: var(--radius-pill, 999px); color: var(--cream, #fffaf1); background: var(--coffee, #2b160e); font-size: .86rem; text-decoration: none; cursor: pointer; font-family: inherit; transition: transform 180ms ease, color 180ms ease, background 180ms ease; }

  .button--light:hover { color: var(--cream, #fffaf1); background: transparent; }
  .text-link { display: inline-flex; align-items: center; gap: 8px; color: var(--coffee, #2b160e); font-size: .82rem; font-weight: 700; text-decoration: none; }
  .text-link:hover { text-decoration: underline; }
  .button:focus-visible, .text-link:focus-visible { outline: 3px solid var(--gold, #bd8740); outline-offset: 4px; }
  svg { width: 1.05rem; height: 1.05rem; fill: none; stroke: currentColor; stroke-width: 1; stroke-linecap: round; stroke-linejoin: round; }
</style>
