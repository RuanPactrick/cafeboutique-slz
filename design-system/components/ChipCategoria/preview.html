<!-- @dsCard group="Ações" height=200 -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Antic+Didone&family=Lustria&display=swap">
<style>
  .wrap { padding: 20px; background: var(--paper, #fbf7ee); font-family: var(--font-body, "Lustria", Georgia, serif); }
  .menu-controls { display: flex; align-items: end; justify-content: space-between; gap: 1rem; padding: 1rem; border: 1px solid var(--rule, #d9cdbb); border-radius: var(--radius-lg, 10px); background: var(--cream, #fffaf1); margin-bottom: 1.1rem; }
  .menu-search { display: grid; width: min(100%, 420px); gap: .35rem; color: var(--muted, #76685c); font-size: .65rem; letter-spacing: .08em; text-transform: uppercase; }
  .menu-search input { width: 100%; min-height: 48px; padding: .7rem 1rem; border: 1px solid var(--rule, #d9cdbb); border-radius: var(--radius-sm, 7px); color: var(--ink, #321f17); background: #fffdf8; font-size: .85rem; text-transform: none; font-family: inherit; }
  .menu-results { color: var(--muted, #76685c); font-size: .72rem; white-space: nowrap; }
  .category-list { display: flex; flex-wrap: wrap; gap: .5rem; margin: 0; padding: 0; }
  .category-chip { min-height: 42px; padding: .55rem 1rem; border: 1px solid var(--rule, #d9cdbb); border-radius: var(--radius-pill, 999px); color: var(--coffee, #2b160e); background: transparent; cursor: pointer; font-size: .72rem; font-family: inherit; }
  .category-chip[aria-pressed="true"] { border-color: var(--coffee, #2b160e); color: var(--cream, #fffaf1); background: var(--coffee, #2b160e); }
  .category-chip:focus-visible, .menu-search input:focus-visible { outline: 3px solid var(--gold, #bd8740); outline-offset: 4px; }
</style>

<div class="wrap">
  <div class="menu-controls">
    <label class="menu-search">
      Buscar no cardápio
      <input type="search" placeholder="bolo, capuccino, tapioca…" value="">
    </label>
    <span class="menu-results">124 itens</span>
  </div>
  <div class="category-list">
    <button class="category-chip" aria-pressed="true" type="button">Tudo</button>
    <button class="category-chip" aria-pressed="false" type="button">Doces</button>
    <button class="category-chip" aria-pressed="false" type="button">Cafés</button>
    <button class="category-chip" aria-pressed="false" type="button">Capuccinos</button>
    <button class="category-chip" aria-pressed="false" type="button">Salgados</button>
    <button class="category-chip" aria-pressed="false" type="button">Tapiocas</button>
    <button class="category-chip" aria-pressed="false" type="button">Sucos</button>
  </div>
</div>
