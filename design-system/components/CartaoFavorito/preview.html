<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Antic+Didone&family=Lustria&display=swap">
<style>
  .grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 1.1rem; padding: 20px; background: var(--paper, #fbf7ee); font-family: var(--font-body, "Lustria", Georgia, serif); }
  .favorite-card { display: flex; flex-direction: column; overflow: hidden; border: 1px solid var(--rule, #d9cdbb); border-radius: var(--radius-xl, 12px); background: var(--cream, #fffaf1); transition: transform 220ms ease, box-shadow 220ms ease; }
  .favorite-card:hover { transform: translateY(-5px); box-shadow: 0 18px 45px rgba(58,37,25,.12); }
  .favorite-card__image { position: relative; aspect-ratio: 1.38; overflow: hidden; background: var(--paper-deep, #f2eadb); }
  .favorite-card__image img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform 450ms ease; }
  .favorite-card:hover img { transform: scale(1.045); }
  .favorite-card--coffee .favorite-card__image { aspect-ratio: 1.8; }
  .favorite-card__body { display: flex; min-height: 138px; flex: 1; flex-direction: column; gap: .4rem; padding: 1rem 1.1rem 1.1rem; }
  .favorite-card h3 { margin: 0; color: var(--coffee, #2b160e); font-family: var(--font-display, "Antic Didone", Georgia, serif); font-weight: 400; line-height: 1.02; font-size: 1.45rem; }
  .favorite-card p { margin: 0; color: var(--muted, #76685c); font-size: .75rem; line-height: 1.45; }
  .favorite-card strong { margin-top: auto; padding-top: .4rem; color: var(--coffee, #2b160e); font-size: .92rem; font-weight: 400; }
  .ph { display: grid; place-items: center; aspect-ratio: 1.38; background: var(--paper-deep, #f2eadb); color: var(--pending, #8f6335); font-size: .64rem; letter-spacing: .14em; text-transform: uppercase; }
</style>

<div class="grid">
  <article class="favorite-card">
    <div class="favorite-card__image"><img src="../../assets/Fotografia/bolos-assados-formas.jpg" alt="Bolos amanteigados recém-assados nas formas"></div>
    <div class="favorite-card__body">
      <h3>Fatia bolo Amanteigado Simples</h3>
      <p>O bolo que a casa é conhecida por fazer.</p>
      <strong>R$ 8,00</strong>
    </div>
  </article>

  <article class="favorite-card">
    <div class="favorite-card__image"><img src="../../assets/Fotografia/sobremesa-morango-chocolate.jpg" alt="Sobremesa de morango com chocolate"></div>
    <div class="favorite-card__body">
      <h3>Supreme de Morango</h3>
      <p>Sobremesa gourmet da vitrine.</p>
      <strong>R$ 25,00</strong>
    </div>
  </article>

  <article class="favorite-card">
    <div class="ph">Foto a confirmar</div>
    <div class="favorite-card__body">
      <h3>Fatia Bolo Macaxeira</h3>
      <p>Sabor regional. A foto deste item ainda não existe no acervo.</p>
      <strong>R$ 15,00</strong>
    </div>
  </article>
</div>
